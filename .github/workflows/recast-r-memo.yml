name: Recast R memo

on:
  push:
    paths:
      - "00-recast-r-memo/**"
      - ".github/workflows/recast-r-memo.yml"
  pull_request:
    paths:
      - "00-recast-r-memo/**"
      - ".github/workflows/recast-r-memo.yml"

jobs:
  run-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 00-recast-r-memo
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: 00-recast-r-memo
          extra-packages: any::tidyverse, any::broom, any::lubridate
          needs: check
      - name: Rscript R/run.R
        run: Rscript R/run.R
