name: Recast R memo

on:
  push:
    paths:
      - "00-recast-r-memo/**"
      - ".github/workflows/recast-r-memo.yml"
  pull_request:
    paths:
      - "00-recast-r-memo/**"
      - ".github/workflows/recast-r-memo.yml"

jobs:
  run-memo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 00-recast-r-memo
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install tidyverse broom lubridate
        run: |
          install.packages(c("tidyverse", "lubridate", "broom"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}
      - name: Rscript R/run.R
        run: Rscript R/run.R
